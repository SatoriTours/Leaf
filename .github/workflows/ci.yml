name: Nim + GPUI 构建与测试
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.6'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 安装 GPUI 构建与桌面测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libssl-dev libclang-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libwayland-dev libvulkan-dev mesa-vulkan-drivers fonts-noto-cjk xvfb xauth xdotool
      - name: GPUI Kit 控件与 ABI 回归
        run: cargo test --workspace --locked
      - name: 构建 GPUI 桥接与 Nim CLI
        run: |
          cargo build --locked -p leaf-gpui
          nim c -d:release --out:target/nim/leaf src/leaf_cli.nim
      - name: Nim 核心和工具回归
        run: nim c -r --out:target/nim/test_runner scripts/test.nim
      - name: SDK 归档、安装与发布脚本测试
        run: python3 -m unittest discover -s tests/release -v
      - name: 真实 Nim + GPUI 窗口交互
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: nim c -r --out:target/nim/native_test scripts/native_test.nim
      - name: 示例与发布包
        run: |
          target/nim/leaf --headless --click add examples/counter.nim
          target/nim/leaf --check example/main.nim
          target/nim/leaf pack examples/project --target linux --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: Nim-GPUI-Linux发布包
          path: dist/*
          if-no-files-found: error
