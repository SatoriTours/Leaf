name: Nim 与 Windows 原生构建测试
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.6'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 CLI 并回归共享运行时
        run: |
          nim c -d:release --out:target/nim/leaf src/leaf_cli.nim
          nim c -r --out:target/nim/test_runner scripts/test.nim
      - name: 无界面示例检查
        run: |
          nim c -d:leafHeadlessOnly -r examples/counter.nim --headless --click add
          nim c -d:leafHeadlessOnly -r example/main.nim --check
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 准备 Windows 编译链
        shell: pwsh
        run: ./scripts/prepare_windows_sdk.ps1
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.6'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 运行 Windows 原生控件测试
        run: nim c -r --out:target/nim/test_win32.exe scripts/test_win32.nim
      - name: 构建 CLI 与原生发布包
        shell: pwsh
        run: |
          nim c -d:release --out:target/nim/leaf.exe src/leaf_cli.nim
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
          Push-Location examples/native_forms
          try {
            ../../target/nim/leaf.exe pack --target windows --output ../../dist
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows packaging failed' }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows原生示例发布包
          path: dist/*
          if-no-files-found: error
