name: Nim 共享运行时性能测量
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.6'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 测量共享运行时（不代表原生控件绘制性能）
        run: |
          nim c -d:release --out:target/nim/leaf-performance scripts/performance.nim
          target/nim/leaf-performance --suite runtime --iterations 100 --warmup 100 --rounds 5 --repeat 2 --output artifacts/performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nim运行时性能原始数据
          path: artifacts/performance
          if-no-files-found: error
