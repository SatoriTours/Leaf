name: Model 三平台回归
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.6'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 同连接 ORM、Model、应用上下文和脚手架
        run: |
          export NIM="$(command -v nim)"
          nim c -r --out:target/nim/model_runner scripts/test.nim --model-only
      - name: 无 Git 源码归档自测
        run: |
          mkdir -p target/model-source-archive
          git archive HEAD | tar -x -C target/model-source-archive
          cd target/model-source-archive
          export NIM="$(command -v nim)"
          nim c -r --skipUserCfg:on --skipParentCfg:on --nimcache:target/nim/runner-cache --out:target/nim/model_runner scripts/test.nim --model-only
