name: Windows 原生 SDK 快速验证
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 提供 Windows 原生 SDK 构建产物的 workflow run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 准备编译链镜像
        shell: pwsh
        run: ./scripts/prepare_windows_sdk.ps1
      - uses: actions/download-artifact@v4
        with:
          name: sdk-windows-x86_64
          path: dist/sdk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查原生 SDK 与安装回归
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path (Get-Location) 'dist/sdk/leaf-sdk-windows-x86_64.zip'
          $work = Join-Path $env:RUNNER_TEMP 'leaf-native-sdk-check'
          Expand-Archive -LiteralPath $archive -DestinationPath $work
          $metadata = Get-Content (Join-Path $work 'leaf-sdk/sdk.json') -Raw | ConvertFrom-Json
          if ($metadata.schema -ne 2 -or $metadata.backend -ne 'native') { throw 'Native SDK schema 2 required' }
          & (Join-Path $work 'leaf-sdk/toolchain/nim/bin/nim.exe') c -d:release "--out:$work/verify_sdk_install.exe" scripts/verify_sdk_install.nim
          if ($LASTEXITCODE -ne 0) { throw 'SDK verification tool compilation failed' }
          & "$work/verify_sdk_install.exe" --target windows-x86_64 --channel $metadata.channel --version $metadata.version
          if ($LASTEXITCODE -ne 0) { throw 'Native SDK verification failed' }
