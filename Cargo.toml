[workspace]
members = ["crates/leaf-gpui"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
[workspace.dependencies]
gpui-kit = "=0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.dev]
debug = 0
[profile.test]
debug = 0
